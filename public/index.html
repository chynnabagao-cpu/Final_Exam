<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System | SLSU</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { 
            --primary: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --dark: #0f172a; 
            --white: #ffffff;
            --shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
            
            /* Nav Specific Colors */
            --nav-bg: rgba(15, 23, 42, 0.85);
            --nav-border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; }

        body { 
            font-family: 'Inter', sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            background-attachment: fixed;
            margin: 0; 
            min-height: 100vh;
        }

        /* --- UPDATED MODERN NAVIGATION STYLES --- */
        nav {
            background: var(--nav-bg);
            backdrop-filter: blur(15px) saturate(180%);
            -webkit-backdrop-filter: blur(15px) saturate(180%);
            border-bottom: 1px solid var(--nav-border);
            padding: 1.2rem 0;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 2000;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Scrolled state for the nav */
        nav.scrolled {
            padding: 0.7rem 0;
            background: rgba(15, 23, 42, 0.95);
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.4);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 2rem;
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            cursor: pointer;
        }

        .logo-icon {
            background: var(--primary);
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            color: white;
            font-size: 1.2rem;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .logo-text {
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--white);
            background: var(--primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-menu {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .nav-link {
            color: rgba(248, 250, 252, 0.8);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            padding: 0.7rem 1.2rem;
            border-radius: 12px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-link i { font-size: 1rem; }

        .nav-link:hover {
            color: var(--white);
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        /* Specialized CTA button in Nav */
        .nav-link.admin-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            margin-left: 10px;
        }

        .nav-link.admin-btn:hover {
            background: var(--white);
            color: var(--dark);
        }

        /* Professional Mobile Toggle */
        .mobile-toggle {
            display: none;
            flex-direction: column;
            gap: 5px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 10px;
            z-index: 2001;
        }

        .mobile-toggle span {
            width: 25px;
            height: 2px;
            background: var(--white);
            border-radius: 2px;
            transition: 0.4s;
        }

        /* Animation: Hamburger to 'X' */
        .mobile-toggle.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
        .mobile-toggle.open span:nth-child(2) { opacity: 0; }
        .mobile-toggle.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

        /* --- REST OF THE LAYOUT --- */
        .container { 
            max-width: 1200px; 
            margin: 140px auto 2rem; 
            padding: 0 2rem; 
        }

        .card { 
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            padding: 2.5rem; 
            border-radius: 24px; 
            box-shadow: var(--shadow);
            margin-bottom: 3rem; 
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--primary);
        }

        h2 { 
            color: var(--dark); 
            font-size: 1.8rem;
            font-weight: 800;
            margin: 0 0 2rem 0;
        }

        form { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
            gap: 1.5rem; 
        }

        .form-group { display: flex; flex-direction: column; }

        label { 
            font-weight: 700; 
            margin-bottom: 0.5rem; 
            color: var(--dark); 
            font-size: 0.9rem;
        }

        input, select { 
            padding: 1rem; 
            border: 2px solid #e2e8f0; 
            border-radius: 12px; 
            outline: none;
            transition: 0.3s;
        }

        input:focus { border-color: #667eea; }

        .btn-submit { 
            background: var(--primary);
            color: white;
            padding: 1rem;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            grid-column: 1 / -1;
            transition: 0.3s;
        }

        .btn-submit:hover { opacity: 0.9; transform: translateY(-2px); }

        .table-container { overflow-x: auto; border-radius: 15px; }

        table { width: 100%; border-collapse: collapse; background: white; }
        
        th { background: #f8fafc; padding: 1.2rem; text-align: left; font-size: 0.8rem; text-transform: uppercase; color: #64748b; }
        
        td { padding: 1.2rem; border-bottom: 1px solid #f1f5f9; }

        .btn-action { padding: 0.5rem 1rem; border-radius: 8px; text-decoration: none; font-size: 0.8rem; font-weight: 600; margin-right: 5px; }
        .btn-edit { background: #fef3c7; color: #d97706; }
        .btn-delete { background: #fee2e2; color: #dc2626; }

        @media (max-width: 768px) {
            .mobile-toggle { display: flex; }
            
            .nav-menu {
                position: fixed;
                top: 0;
                right: -100%;
                width: 70%;
                height: 100vh;
                background: #0f172a;
                flex-direction: column;
                justify-content: center;
                padding: 2rem;
                transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
                box-shadow: -10px 0 30px rgba(0,0,0,0.5);
            }

            .nav-menu.open { right: 0; }

            .nav-link {
                width: 100%;
                padding: 1.2rem;
                font-size: 1.1rem;
                border-bottom: 1px solid rgba(255,255,255,0.05);
            }

            .container { margin-top: 100px; padding: 0 1rem; }
        }

        footer { 
            text-align: center; 
            padding: 3rem; 
            color: white; 
            background: rgba(15, 23, 42, 0.9);
            margin-top: 4rem;
        }
    </style>
</head>
<body>

<!-- UPDATED NAVIGATION -->
<nav id="navbar">
    <div class="nav-container">
        <a class="nav-logo" onclick="scrollToTop()">
            <div class="logo-icon"><i class="fas fa-graduation-cap"></i></div>
            <span class="logo-text">SMS Portal</span>
        </a>

        <ul class="nav-menu" id="nav-menu">
            <li><a href="#registration-section" class="nav-link"><i class="fas fa-plus-circle"></i> Add Student</a></li>
            <li><a href="#list-section" class="nav-link"><i class="fas fa-users"></i> View Records</a></li>
            <li><a href="#" class="nav-link"><i class="fas fa-chart-pie"></i> Reports</a></li>
            <li><a href="#" class="nav-link admin-btn"><i class="fas fa-lock"></i> Admin Entry</a></li>
        </ul>

        <button class="mobile-toggle" id="mobile-toggle">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </div>
</nav>

<div class="container">
    
    <!-- Registration Section -->
    <div class="card" id="registration-section">
        <h2 id="form-title"><i class="fas fa-user-plus"></i> Student Registration</h2>
        <form action="/add-student" method="POST" id="student-form">
            <div class="form-group">
                <label>Student ID</label>
                <input type="text" name="student_id" id="student_id" placeholder="e.g. 2024-0001" required>
            </div>
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="full_name" id="full_name" placeholder="Enter full name" required>
            </div>
            <div class="form-group">
                <label>Course</label>
                <input type="text" name="course" id="course" placeholder="e.g. BSIT" required>
            </div>
            <div class="form-group">
                <label>Year Level</label>
                <select name="year_level" id="year_level" required>
                    <option value="">Select Year</option>
                    <option value="1st Year">1st Year</option>
                    <option value="2nd Year">2nd Year</option>
                    <option value="3rd Year">3rd Year</option>
                    <option value="4th Year">4th Year</option>
                </select>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email_address" id="email_address" placeholder="student@slsu.edu.ph" required>
            </div>
            
            <button type="submit" id="submit-btn" class="btn-submit">Register Student</button>
        </form>
    </div>

    <!-- Student List Section -->
    <div class="card" id="list-section">
        <h2><i class="fas fa-list-ul"></i> Registered Students</h2>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Course</th>
                        <th>Year</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="student-data">
                    <!-- Data would be dynamically inserted here -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<footer>
    <p>&copy; 2026 Student Management System | SLSU Final Examination Project</p>
</footer>

<script>
    // NAVIGATION LOGIC
    const navbar = document.getElementById('navbar');
    const mobileToggle = document.getElementById('mobile-toggle');
    const navMenu = document.getElementById('nav-menu');

    // Toggle Mobile Menu
    mobileToggle.addEventListener('click', () => {
        mobileToggle.classList.toggle('open');
        navMenu.classList.toggle('open');
    });

    // Close Menu on Link Click
    document.querySelectorAll('.nav-link').forEach(link => {
        link.addEventListener('click', () => {
            mobileToggle.classList.remove('open');
            navMenu.classList.remove('open');
        });
    });

    // Sticky Navbar Scroll Effect
    window.addEventListener('scroll', () => {
        if (window.scrollY > 50) {
            navbar.classList.add('scrolled');
        } else {
            navbar.classList.remove('scrolled');
        }
    });

    function scrollToTop() {
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Dummy data fetch placeholder
    async function fetchStudents() {
        const tableBody = document.getElementById('student-data');
        // This is where your API integration lives
        tableBody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:#64748b;">Waiting for database connection...</td></tr>';
    }

    window.onload = fetchStudents;
</script>

</body>
</html>
